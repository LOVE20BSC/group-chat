[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
deny = "warnings"
auto_detect_remappings = false

[fuzz]
runs = 256

[invariant]
runs = 32
depth = 15
fail_on_revert = false

[lint]
severity = ["high", "med", "low"]
ignore = ["test/**/*.sol"]
exclude_lints = [
    "calls-loop",
    "reentrancy-events",
    "unused-return",
    "require-revert-in-loop",
    "reentrancy-no-eth",
    "weak-prng",
    "unsafe-typecast",
    "encode-packed-collision",
    "missing-zero-check",
]
